# Dummy-only faithful reproduction of the assessed workflow_run boundary.
name: windows-e2e

on:
  workflow_run:
    workflows: [Build e2e image]
    types:
      - completed

jobs:
  windows-qe:
    runs-on: ubuntu-latest
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.triggering_actor != 'dependabot[bot]'
    env:
      IMAGE_NAME_E2E: macadam-e2e
      windows-version: '11'
      windows-featurepack: '23h2-ent'
      # Known dummy canaries. The token cannot administer Actions secrets on
      # this newly-created repo, so these replace only the secret-store source.
      ARM_TENANT_ID: dummy-arm-tenant-id
      ARM_SUBSCRIPTION_ID: dummy-arm-subscription-id
      ARM_CLIENT_ID: dummy-arm-client-id
      ARM_CLIENT_SECRET: 4bb6fe58-88d6-453c-aafd-8c852dae49f1
      AZURE_STORAGE_ACCOUNT: dummy-storage-account
      AZURE_STORAGE_KEY: 47f74764-90fa-4175-9785-03e17b248f44
    permissions:
      statuses: write
      checks: write

    steps:
      - name: Download qe oci image
        id: download-qe-oci-image-artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.IMAGE_NAME_E2E }}-windows-amd64
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Correlate
        run: |
          commit_sha=${{ github.event.workflow_run.head_commit.id }}
          if [[ -z "${commit_sha}" ]] || [[ "${commit_sha}" == null ]]; then
            commit_sha=${{ github.event.workflow_run.head_sha }}
          fi
          echo "commit_sha=${commit_sha}" >> "$GITHUB_ENV"
          echo "status_context=ci/gh/e2e/windows-validation" >> "$GITHUB_ENV"

      - name: Mask dummy canaries
        run: |
          echo "::add-mask::$ARM_CLIENT_SECRET"
          echo "::add-mask::$AZURE_STORAGE_KEY"

      - name: Add status to the PR check
        run: echo "Status API call skipped - dummy environment"

      # The expressions below intentionally preserve production's vulnerable
      # early interpolation into a retained RUNNER_TEMP shell script. No Azure
      # request is made and every value is a non-secret canary.
      - name: Create Windows instance
        run: |
          set -euo pipefail
          ARM_TENANT_ID='${{ env.ARM_TENANT_ID }}'
          ARM_SUBSCRIPTION_ID='${{ env.ARM_SUBSCRIPTION_ID }}'
          ARM_CLIENT_ID='${{ env.ARM_CLIENT_ID }}'
          ARM_CLIENT_SECRET='${{ env.ARM_CLIENT_SECRET }}'
          AZURE_STORAGE_ACCOUNT='${{ env.AZURE_STORAGE_ACCOUNT }}'
          AZURE_STORAGE_KEY='${{ env.AZURE_STORAGE_KEY }}'
          test -n "$ARM_CLIENT_SECRET"
          test -n "$AZURE_STORAGE_KEY"
          printf '%s\n' dummy-host > host
          printf '%s\n' dummy-user > username
          printf '%s\n' dummy-key > id_rsa
          echo "Azure provisioning skipped - dummy environment"

      # This remains a real Podman load/run of the fork-produced OCI image.
      # Deliberately no ARM_* or AZURE_* variable is passed to the container.
      - name: Run macadam e2e
        run: |
          set -euo pipefail
          podman load -i "${IMAGE_NAME_E2E}-windows-amd64.tar"
          podman run --rm \
            -e OS=windows \
            -e OUTPUT_FOLDER=/data \
            -v "$PWD:/data:z" \
            "${IMAGE_NAME_E2E}:windows-amd64"
          test -L runner-temp.results
          test "$(readlink runner-temp.results)" = /home/runner/work/_temp
          test "$(cat direct-env-check.log)" = "ARM_CLIENT_SECRET=ABSENT"

      - name: Test Report
        id: test-report
        uses: mikepenz/action-junit-report@v6
        if: always()
        with:
          fail_on_failure: true
          include_passed: true
          detailed_summary: true
          require_tests: true
          report_paths: '**/*.xml'

      - name: Upload e2e results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-validation
          path: |
            **/*.xml
            **/*.results
            **/*.log

      - name: Update status of the PR check
        if: always()
        run: echo "Status API call skipped - dummy environment"

      - name: Destroy instance
        if: always()
        run: echo "Azure destruction skipped - dummy environment"
